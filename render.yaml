# Render Blueprint — deploys the API + a managed PostgreSQL in one go.
# In the Render dashboard: New → Blueprint → pick this repo. Then set
# CORS_ORIGIN to your deployed frontend URL.
services:
  - type: web
    name: studytrack-api
    runtime: docker
    rootDir: server
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    plan: free
    envVars:
      - key: JWT_SECRET
        generateValue: true # Render generates a strong secret
      - key: CORS_ORIGIN
        sync: false # set this to your frontend's URL (e.g. https://studytrack.vercel.app)
      - key: DATABASE_URL
        fromDatabase:
          name: studytrack-db
          property: connectionString

databases:
  - name: studytrack-db
    plan: free
